name: Run V9.7 Apply Payload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute V9.7 modularization payload
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/apply-v970-modularization.yml').read_text(encoding='utf-8')
          m = re.search(
              r'(?ms)^      - name: Extract modular sources and install V9\.7 build pipeline\n'
              r'        shell: bash\n'
              r'        run: \|\n'
              r'(.*?)'
              r'^      - name: Run full release check\n',
              source,
          )
          if not m:
              raise SystemExit('cannot locate V9.7 modularization payload')
          payload = textwrap.dedent(m.group(1))
          Path('/tmp/v970-payload.sh').write_text(payload, encoding='utf-8')
          PY
          bash /tmp/v970-payload.sh

      - name: Run full release check
        run: npm run release:check

      - name: Commit V9.7 modular architecture
        shell: bash
        run: |
          git config user.name 'MindDeck'
          git config user.email 'minddeck@local'
          git rm -f .github/workflows/apply-v970-modularization.yml
          git rm -f .github/workflows/run-v970-apply.yml
          git rm -f .github/workflows/dispatch-v970-on-pr.yml
          git add .
          git commit -m 'refactor: modularize V9.7 source with standalone HTML build'
          git push
