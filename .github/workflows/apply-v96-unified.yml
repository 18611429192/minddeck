name: Apply V9.6.5 Unified Architecture

on:
  push:
    branches: [main]
    paths:
      - '.minddeck-update/chunks/**'
      - '.github/workflows/apply-v96-unified.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild and verify update archive
        run: |
          cat .minddeck-update/chunks/* | base64 -d > /tmp/minddeck-v96.zip
          echo '2777f524ba1027f21f3c9535dc193f9f6697ce846c8b4885c4e8ae2e8d6add2f  /tmp/minddeck-v96.zip' | sha256sum -c -
          unzip -t /tmp/minddeck-v96.zip

      - name: Apply V9.6.5 unified architecture
        run: |
          rm -rf /tmp/minddeck-v96
          mkdir -p /tmp/minddeck-v96
          unzip -q /tmp/minddeck-v96.zip -d /tmp/minddeck-v96
          cp -a /tmp/minddeck-v96/. .
          rm -rf .minddeck-update
          rm -f .github/workflows/apply-v96-unified.yml

      - name: Run full release checks
        run: npm run release:check

      - name: Commit unified architecture
        run: |
          git config user.name 'MindDeck'
          git config user.email 'minddeck@local'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'refactor: complete unified MindDeck runtime architecture'
          git push origin HEAD:main
