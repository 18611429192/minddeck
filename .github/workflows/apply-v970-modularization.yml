name: Apply V9.7 Modular Single-HTML Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v970-modularization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract modular sources and install V9.7 build pipeline
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const read = p => fs.readFileSync(p, 'utf8');
          const write = (p, text) => {
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, text.endsWith('\n') ? text : text + '\n');
          };
          const replaceOnce = (text, from, to, label) => {
            const i = text.indexOf(from);
            if (i < 0) throw new Error(`missing ${label}`);
            return text.slice(0, i) + to + text.slice(i + from.length);
          };
          const regexIndex = (text, re, label, from = 0) => {
            const slice = text.slice(from);
            const m = re.exec(slice);
            if (!m) throw new Error(`missing ${label}`);
            return from + m.index;
          };

          const indexPath = 'index.html';
          let html = read(indexPath);

          // 1) Extract the current app stylesheet from <head> only, so portable template styles inside JS are ignored.
          const headEnd = html.indexOf('</head>');
          if (headEnd < 0) throw new Error('index </head> missing');
          const head = html.slice(0, headEnd);
          const appStyleMatch = /<style>([\s\S]*?)<\/style>/.exec(head);
          if (!appStyleMatch) throw new Error('main app style block missing');
          let appStyles = appStyleMatch[1].trim();
          const appStyleFull = appStyleMatch[0];

          // 2) Extract the main application script. Shared runtime is the first real script; app is the last real script.
          const scriptRe = /<script(?: [^>]*)?>([\s\S]*?)<\/script>/g;
          const scripts = [...html.matchAll(scriptRe)];
          if (scripts.length < 2) throw new Error('expected shared runtime + app script');
          const appScriptMatch = scripts.at(-1);
          let appSource = appScriptMatch[1].trim();

          // 3) Keep shared runtime as the single business implementation, but bump the runtime/application version.
          let runtime = read('src/runtime/shared-core.js');
          runtime = replaceOnce(runtime, "const VERSION='9.6.6';", "const VERSION='9.7.0';", 'shared runtime version');
          write('src/runtime/shared-core.js', runtime.trimEnd());
          appSource = replaceOnce(appSource, 'APP_VERSION="9.6.6 RC"', 'APP_VERSION="9.7.0 RC"', 'app version');
          appSource = replaceOnce(appSource, 'RUNTIME_VERSION="9.6.6"', 'RUNTIME_VERSION="9.7.0"', 'app runtime version');

          // 4) Split the existing application closure into ordered semantic source fragments.
          //    They intentionally share one lexical scope after concatenation; build output remains behavior-identical.
          const pMap = regexIndex(appSource, /\n\s*\/\/ map\s*\n/, 'map module marker');
          const pEditor = regexIndex(appSource, /\n\s*\/\/ freeform editor\s*\n/, 'editor module marker', pMap + 1);
          const pPresentation = regexIndex(appSource, /\n\s*\/\/ presentation host:/, 'presentation module marker', pEditor + 1);
          const pPortable = regexIndex(appSource, /\n\s*function buildPortableHtml\s*\(/, 'portable export marker', pPresentation + 1);
          const pBindings = regexIndex(appSource, /\n\s*\/\/ bindings map\s*\n/, 'bindings module marker', pPortable + 1);
          if (!(0 < pMap && pMap < pEditor && pEditor < pPresentation && pPresentation < pPortable && pPortable < pBindings)) {
            throw new Error('application module order invalid');
          }

          const jsModules = [
            ['00-bootstrap.js', appSource.slice(0, pMap)],
            ['10-map.js', appSource.slice(pMap, pEditor)],
            ['20-slide-editor.js', appSource.slice(pEditor, pPresentation)],
            ['30-presentation.js', appSource.slice(pPresentation, pPortable)],
            ['40-portable-export.js', appSource.slice(pPortable, pBindings)],
            ['90-bindings-init.js', appSource.slice(pBindings)],
          ];
          fs.rmSync('src/app/modules', { recursive: true, force: true });
          for (const [name, code] of jsModules) write(`src/app/modules/${name}`, code.trimEnd());

          // 5) Split CSS by the same UI responsibilities while preserving exact cascade order.
          const cssPos = marker => {
            const i = appStyles.indexOf(marker);
            if (i < 0) throw new Error(`missing CSS marker ${marker}`);
            return i;
          };
          const cMap = cssPos('/* mind map */');
          const cEditor = cssPos('/* freeform editor */');
          const cPresentation = cssPos('/* presentation */');
          const cResponsive = appStyles.indexOf('@media', cPresentation);
          if (!(0 < cMap && cMap < cEditor && cEditor < cPresentation && cResponsive > cPresentation)) {
            throw new Error('stylesheet module order invalid');
          }
          const cssModules = [
            ['00-base.css', appStyles.slice(0, cMap)],
            ['10-map.css', appStyles.slice(cMap, cEditor)],
            ['20-slide-editor.css', appStyles.slice(cEditor, cPresentation)],
            ['30-presentation-shell.css', appStyles.slice(cPresentation, cResponsive)],
            ['90-responsive.css', appStyles.slice(cResponsive)],
          ];
          fs.rmSync('src/app/styles', { recursive: true, force: true });
          for (const [name, code] of cssModules) write(`src/app/styles/${name}`, code.trimEnd());

          const manifest = {
            schemaVersion: 1,
            buildMode: 'ordered-fragments',
            description: 'V9.7 source modules are concatenated in order into one browser closure; release artifact remains one standalone HTML.',
            scripts: jsModules.map(([name]) => `modules/${name}`),
            styles: cssModules.map(([name]) => `styles/${name}`),
          };
          write('src/app/app.manifest.json', JSON.stringify(manifest, null, 2));

          // 6) Turn the current index into a source shell with four explicit build slots.
          let shell = html;
          shell = shell.slice(0, appStyleMatch.index) + '<style id="minddeck-app-styles">\n__MINDDECK_APP_STYLES__\n</style>' + shell.slice(appStyleMatch.index + appStyleFull.length);

          const sharedStylesRe = /<!-- MINDDECK_SHARED_STYLES_START -->\s*<style id="minddeck-shared-styles">\s*[\s\S]*?\s*<\/style>\s*<!-- MINDDECK_SHARED_STYLES_END -->/;
          const sharedRuntimeRe = /<!-- MINDDECK_SHARED_RUNTIME_START -->\s*<script id="minddeck-shared-runtime">\s*[\s\S]*?\s*<\/script>\s*<!-- MINDDECK_SHARED_RUNTIME_END -->/;
          if (!sharedStylesRe.test(shell)) throw new Error('shared styles build block missing');
          if (!sharedRuntimeRe.test(shell)) throw new Error('shared runtime build block missing');
          shell = shell.replace(sharedStylesRe, '<!-- MINDDECK_SHARED_STYLES_START -->\n<style id="minddeck-shared-styles">\n__MINDDECK_SHARED_STYLES__\n</style>\n<!-- MINDDECK_SHARED_STYLES_END -->');
          shell = shell.replace(sharedRuntimeRe, '<!-- MINDDECK_SHARED_RUNTIME_START -->\n<script id="minddeck-shared-runtime">\n__MINDDECK_SHARED_RUNTIME__\n</script>\n<!-- MINDDECK_SHARED_RUNTIME_END -->');

          // Re-find the last outer script after the earlier replacements, then replace it with the app bundle slot.
          const shellScripts = [...shell.matchAll(scriptRe)];
          const lastScript = shellScripts.at(-1);
          shell = shell.slice(0, lastScript.index) + '<script id="minddeck-app-bundle">\n__MINDDECK_APP_BUNDLE__\n</script>' + shell.slice(lastScript.index + lastScript[0].length);
          shell = shell.replaceAll('V9.6.6 RC', 'V9.7.0 RC');
          write('src/app/shell.html', shell.trimEnd());

          write('src/app/README.md', `# MindDeck V9.7 application source\n\nV9.7 separates **source organization** from **release shape**.\n\n- \`shell.html\` owns static HTML structure and build slots.\n- \`app.manifest.json\` defines ordered JS/CSS source fragments.\n- \`modules/\` contains editor/map/presentation/export host logic.\n- \`styles/\` contains UI styles split by responsibility.\n- \`../runtime/shared-core.js\` remains the single business/runtime implementation.\n\nThe fragments deliberately compile into one browser closure so the refactor does not change runtime behavior. \`npm run build\` embeds all app CSS, shared CSS, shared runtime and app modules back into the repository-root \`index.html\`. The release artifact has **no external JS/CSS dependency** and can still be opened directly as one file.\n`);

          // 7) Install the deterministic single-file builder.
          write('scripts/build-single-html.mjs', `import fs from 'node:fs';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst here=path.dirname(fileURLToPath(import.meta.url));\nconst root=path.resolve(here,'..');\nconst read=p=>fs.readFileSync(path.join(root,p),'utf8').trimEnd();\nconst manifest=JSON.parse(read('src/app/app.manifest.json'));\nconst shell=read('src/app/shell.html');\nconst appStyles=manifest.styles.map(p=>read('src/app/'+p)).join('\\n\\n');\nconst appBundle=manifest.scripts.map(p=>read('src/app/'+p)).join('\\n\\n');\nconst sharedStyles=read('src/runtime/shared-styles.css');\nconst sharedRuntime=read('src/runtime/shared-core.js');\n\nconst slots={\n  '__MINDDECK_APP_STYLES__':appStyles,\n  '__MINDDECK_SHARED_STYLES__':sharedStyles,\n  '__MINDDECK_SHARED_RUNTIME__':sharedRuntime,\n  '__MINDDECK_APP_BUNDLE__':appBundle,\n};\nlet out=shell;\nfor(const [slot,value] of Object.entries(slots)){\n  const count=out.split(slot).length-1;\n  if(count!==1)throw new Error('build slot '+slot+' expected once, got '+count);\n  out=out.replace(slot,value);\n}\nif(/__MINDDECK_[A-Z0-9_]+__/.test(out))throw new Error('unresolved MindDeck build slot');\nfs.writeFileSync(path.join(root,'index.html'),out+'\\n');\nconsole.log('MindDeck V9.7 standalone index.html built from modular sources');\n`);
          write('scripts/build-runtime.mjs', `// Compatibility entry point. V9.7 builds the entire standalone HTML, not only the runtime block.\nimport './build-single-html.mjs';\n`);

          write('scripts/verify-modular-build.mjs', `import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst html=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');\nconst shell=fs.readFileSync(new URL('../src/app/shell.html',import.meta.url),'utf8');\nconst manifest=JSON.parse(fs.readFileSync(new URL('../src/app/app.manifest.json',import.meta.url),'utf8'));\nconst read=p=>fs.readFileSync(new URL('../src/app/'+p,import.meta.url),'utf8').trimEnd();\nconst runtime=fs.readFileSync(new URL('../src/runtime/shared-core.js',import.meta.url),'utf8').trimEnd();\nconst sharedStyles=fs.readFileSync(new URL('../src/runtime/shared-styles.css',import.meta.url),'utf8').trimEnd();\nconst appBundle=manifest.scripts.map(read).join('\\n\\n');\nconst appStyles=manifest.styles.map(read).join('\\n\\n');\nfor(const slot of ['__MINDDECK_APP_STYLES__','__MINDDECK_SHARED_STYLES__','__MINDDECK_SHARED_RUNTIME__','__MINDDECK_APP_BUNDLE__']) assert.ok(shell.includes(slot),'shell slot missing: '+slot);\nassert.ok(manifest.scripts.length>=6,'application source was not meaningfully modularized');\nassert.ok(manifest.styles.length>=5,'application CSS was not meaningfully modularized');\nconst take=(re,label)=>{const m=html.match(re);assert.ok(m,label+' missing');return m[1].trimEnd()};\nassert.equal(take(/<style id="minddeck-app-styles">\\s*([\\s\\S]*?)\\s*<\\/style>/,'app styles'),appStyles,'generated app styles drifted');\nassert.equal(take(/<!-- MINDDECK_SHARED_STYLES_START -->\\s*<style id="minddeck-shared-styles">\\s*([\\s\\S]*?)\\s*<\\/style>/,'shared styles'),sharedStyles,'generated shared styles drifted');\nassert.equal(take(/<!-- MINDDECK_SHARED_RUNTIME_START -->\\s*<script id="minddeck-shared-runtime">\\s*([\\s\\S]*?)\\s*<\\/script>/,'shared runtime'),runtime,'generated shared runtime drifted');\nassert.equal(take(/<script id="minddeck-app-bundle">\\s*([\\s\\S]*?)\\s*<\\/script>/,'app bundle'),appBundle,'generated app bundle drifted');\nconsole.log('V9.7 modular source/build parity: OK');\n`);

          write('scripts/verify-single-html.mjs', `import fs from 'node:fs';\nimport vm from 'node:vm';\nimport assert from 'node:assert/strict';\nconst html=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');\nassert.ok(html.includes('<!DOCTYPE html')&&html.includes('</html>'),'standalone HTML structure incomplete');\nassert.ok(!/<script[^>]+\\bsrc\\s*=/i.test(html),'standalone artifact depends on external script');\nassert.ok(!/<link[^>]+rel=["']?stylesheet/i.test(html),'standalone artifact depends on external stylesheet');\nassert.ok(!/\\b(?:src|href)=["'](?:\\.\\.?\\/)[^"']+\\.(?:js|css)(?:[?#][^"']*)?["']/i.test(html),'standalone artifact has relative JS/CSS dependency');\nassert.ok(!/__MINDDECK_[A-Z0-9_]+__/.test(html),'standalone artifact contains unresolved build slots');\nconst scripts=[...html.matchAll(/<script(?: [^>]*)?>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]);\nassert.ok(scripts.length>=2,'standalone runtime/app scripts missing');\nscripts.forEach((code,i)=>new vm.Script(code,{filename:'standalone-script-'+(i+1)+'.js'}));\nconsole.log('Standalone single-HTML contract: OK (no external JS/CSS runtime dependency)');\n`);

          // 8) Update package/build/test entry points.
          const pkg=JSON.parse(read('package.json'));
          pkg.version='9.7.0-rc.1';
          pkg.scripts={
            build:'node scripts/build-single-html.mjs',
            'build:single':'node scripts/build-single-html.mjs',
            'build:runtime':'node scripts/build-runtime.mjs',
            test:'node scripts/release-check.mjs',
            check:'node scripts/release-check.mjs',
            'release:check':'node scripts/release-check.mjs',
            'audit:architecture':'node scripts/verify-architecture.mjs',
            serve:'python -m http.server 8080'
          };
          write('package.json', JSON.stringify(pkg,null,2));

          write('scripts/release-check.mjs', `import { spawnSync } from 'node:child_process';\nconst commands=[\n  ['node',['scripts/build-single-html.mjs']],\n  ['node',['tests/core.test.mjs']],\n  ['node',['tests/shared-runtime.test.mjs']],\n  ['node',['tests/diagnostics.test.mjs']],\n  ['node',['tests/recovery.test.mjs']],\n  ['node',['tests/performance.test.mjs']],\n  ['node',['scripts/verify-index.mjs']],\n  ['node',['scripts/verify-modular-build.mjs']],\n  ['node',['scripts/verify-single-html.mjs']],\n  ['node',['scripts/verify-architecture.mjs']],\n  ['node',['scripts/verify-portable-contracts.mjs']],\n  ['node',['scripts/verify-interaction-contracts.mjs']],\n  ['node',['scripts/verify-theme-contracts.mjs']],\n  ['node',['scripts/verify-recovery-contracts.mjs']],\n  ['node',['scripts/verify-rc-contracts.mjs']],\n];\nfor(const [cmd,args] of commands){const result=spawnSync(cmd,args,{stdio:'inherit'});if(result.status!==0)process.exit(result.status||1)}\nconsole.log('MindDeck release check: ALL OK');\n`);

          let sharedTest=read('tests/shared-runtime.test.mjs');
          sharedTest=replaceOnce(sharedTest,"assert.equal(Core.VERSION,'9.6.6');","assert.equal(Core.VERSION,'9.7.0');",'shared runtime test version');
          write('tests/shared-runtime.test.mjs',sharedTest.trimEnd());

          // 9) Pages must build from source before publishing app.html.
          let pages=read('.github/workflows/pages.yml');
          const pagesNeedle=`      - name: Configure GitHub Pages\n        uses: actions/configure-pages@v6`;
          const pagesInsert=`      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22\n\n      - name: Build standalone app\n        run: npm run build\n\n${pagesNeedle}`;
          pages=replaceOnce(pages,pagesNeedle,pagesInsert,'Pages configure step');
          write('.github/workflows/pages.yml',pages.trimEnd());

          // 10) Documentation: V9.7 explains that modular source still releases a single HTML.
          let readme=read('README.md').replaceAll('V9.6.6 RC','V9.7.0 RC');
          const localHeading='## 本地运行';
          if(!readme.includes('## V9.7：源码模块化，发布仍是单 HTML')){
            const section=`## V9.7：源码模块化，发布仍是单 HTML\n\nV9.7 不改变 MindDeck 的发布优势：**最终产物仍然只有一个 \`index.html\`，不依赖旁边的 JS/CSS 文件，离线双击即可运行。**\n\n变化发生在源码层：\n\n\`\`\`text\nsrc/app/\n├── shell.html\n├── app.manifest.json\n├── modules/\n│   ├── 00-bootstrap.js\n│   ├── 10-map.js\n│   ├── 20-slide-editor.js\n│   ├── 30-presentation.js\n│   ├── 40-portable-export.js\n│   └── 90-bindings-init.js\n└── styles/\n    ├── 00-base.css\n    ├── 10-map.css\n    ├── 20-slide-editor.css\n    ├── 30-presentation-shell.css\n    └── 90-responsive.css\n\`\`\`\n\n构建时 \`scripts/build-single-html.mjs\` 会把上述源码、\`src/runtime/shared-core.js\` 和共享样式重新内联成根目录 \`index.html\`。CI 会同时检查“模块源码 = 生成内容”和“单 HTML 无外部 JS/CSS 依赖”，防止以后重新退化为复制实现或多文件才能运行。\n\n`;
            readme=readme.replace(localHeading,section+localHeading);
          }
          readme=readme.replace('完整编辑器继续保留为单文件：','发布产物继续保留为单文件；源码已经模块化：');
          readme=readme.replace('从 V9.6.5 开始，Pages 首页和 Demo 的显示版本也会从 `package.json` 自动注入，不再手工维护三套版本号。','Pages 首页和 Demo 的显示版本从 `package.json` 自动注入；V9.7 部署前还会先执行 `npm run build`，确保 `app.html` 永远来自模块源码生成的单文件产物。');
          readme=readme.replace('V9.6 已完成业务框架统一。接下来优先完善演示能力、正式汇报可靠性、手机 / 桌面体验和真实项目中的使用问题，而不是重新复制 Runtime。','V9.6 已完成业务框架统一；V9.7 进一步把巨型 `index.html` 的源码职责拆开，同时保持最终单 HTML 发布。接下来可以在不复制 Runtime 的前提下继续完善演示、编辑和移动端能力。');
          write('README.md',readme.trimEnd());

          let audit=read('ARCHITECTURE_AUDIT.md');
          if(!audit.includes('## V9.7 工程模块化')) audit += `\n\n## V9.7 工程模块化\n\nV9.7 在不改变业务 Runtime 的前提下，把根目录巨型 \`index.html\` 从“源码 + 产物混在一起”改为“模块源码 → 单 HTML 产物”：\n\n- \`src/app/shell.html\`：静态页面壳。\n- \`src/app/modules/*\`：按 Bootstrap / Map / Slide Editor / Presentation / Portable Export / Bindings 分层。\n- \`src/app/styles/*\`：按 UI 职责拆分。\n- \`src/runtime/shared-core.js\`：仍然是唯一业务实现源。\n- \`scripts/build-single-html.mjs\`：唯一发布组装器。\n\n新的发布门禁：\n\n\`\`\`text\nV9.7 modular source/build parity: OK\nStandalone single-HTML contract: OK\nArchitecture audit: OK\nMindDeck release check: ALL OK\n\`\`\`\n\n因此“源码模块化”不等于“发布多文件化”；用户拿到的仍然可以只有一个 HTML。\n`;
          write('ARCHITECTURE_AUDIT.md',audit.trimEnd());

          write('docs/architecture-v9.7.md', `# MindDeck V9.7 工程架构\n\n## 目标\n\nV9.7 解决的是工程结构，而不是重新实现功能：\n\n1. 业务规则继续只有 \`src/runtime/shared-core.js\` 一份。\n2. 编辑器 Host 从巨型 \`index.html\` 抽离为可维护模块。\n3. 发布产物继续是一个可离线运行的 HTML。\n\n## Source → Build → Artifact\n\n\`\`\`text\nsrc/app/shell.html\n+ src/app/styles/*\n+ src/runtime/shared-styles.css\n+ src/runtime/shared-core.js\n+ src/app/modules/*\n          │\n          ▼\nscripts/build-single-html.mjs\n          │\n          ▼\nindex.html   ← 唯一发布应用文件\n\`\`\`\n\nJS 模块当前采用 ordered fragments：它们在源码仓库中分文件维护，构建时按 manifest 顺序连接回同一个 IIFE，因此不会因为工程拆分改变既有变量作用域和交互行为。后续如果继续迁移到真正的 ES module，也必须由构建器打包回单 HTML。\n\n## 强制门禁\n\n- \`verify-modular-build.mjs\`：生成的 CSS / Runtime / App Bundle 必须和模块源码逐字一致。\n- \`verify-single-html.mjs\`：发布 HTML 不允许依赖外部 JS/CSS。\n- \`verify-architecture.mjs\`：业务层不允许重新出现第二套 Tree / Layout / Presentation / Renderer / Portable 实现。\n\n## 发布\n\n\`npm run build\` 生成根目录 \`index.html\`。GitHub Pages 部署前也会先运行该命令，再把生成的单文件复制为 \`app.html\`。\n`);

          write('V9.7.0_RC_NOTES.md', `# MindDeck V9.7.0 RC\n\nV9.7.0 是工程模块化版本。\n\n## 本次变化\n\n- 将原本混在根目录 \`index.html\` 中的编辑器 JS 拆成 6 个职责模块。\n- 将主界面 CSS 拆成 5 个职责模块。\n- 新增 \`src/app/shell.html\` 和模块 manifest。\n- 新增 \`scripts/build-single-html.mjs\`，统一生成最终 \`index.html\`。\n- Shared Runtime 继续只有 \`src/runtime/shared-core.js\` 一份。\n- Pages 部署前强制从模块源码重新构建。\n- 新增源码/产物一致性检查和“无外部 JS/CSS 依赖”检查。\n\n## 不变的发布约束\n\n**最终可交付应用仍然是一个独立 HTML 文件。** 不要求同目录存在任何 JS/CSS 文件。\n`);

          write('src/runtime/README.md', `# Shared Runtime\n\nMindDeck V9.7 继续以 \`shared-core.js\` 作为唯一业务 Runtime 实现源。Tree、Project、Layout、Presentation、TOC、Map/Slide/Element Renderer、Input、Fullscreen、Diagnostics、Recovery、Portable 等算法都从这里提供。\n\n应用 Host 已移动到 \`src/app/modules/\`；最终构建由 \`scripts/build-single-html.mjs\` 把 Shared Runtime 与应用模块一起内联进单个 \`index.html\`。\n`);

          // Keep auxiliary public docs synchronized where they still mention the previous live baseline.
          for(const p of ['examples/README.md','site/README.md']){
            if(fs.existsSync(p)) write(p,read(p).replaceAll('V9.6.6 RC','V9.7.0 RC').trimEnd());
          }

          // Initial V9.7 artifact generated immediately; release checks will rebuild it again.
          NODE

          node scripts/build-single-html.mjs

      - name: Run full release check
        run: npm run release:check

      - name: Commit V9.7 modular architecture
        shell: bash
        run: |
          git config user.name 'MindDeck'
          git config user.email 'minddeck@local'
