name: Deploy MindDeck to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/examples _site/assets
          cp -R site/. _site/
          cp index.html _site/app.html
          cp examples/demo.json _site/examples/demo.json
          if [ -f docs/assets/minddeck-demo.gif ]; then cp docs/assets/minddeck-demo.gif _site/assets/minddeck-demo.gif; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
