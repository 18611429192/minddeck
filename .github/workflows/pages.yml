name: Deploy MindDeck to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone app
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/examples _site/assets
          cp -R site/. _site/
          cp index.html _site/app.html
          cp examples/demo.json _site/examples/demo.json
          if [ -f docs/assets/minddeck-demo.gif ]; then
            cp docs/assets/minddeck-demo.gif _site/assets/minddeck-demo.gif
          fi

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const base = pkg.version.split('-')[0];
          const isRc = /-rc(?:\.|$)/.test(pkg.version);
          const displayVersion = `V${base}${isRc ? ' RC' : ''}`;

          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const file = path.join(dir, name);
              const stat = fs.statSync(file);
              if (stat.isDirectory()) walk(file);
              else if (file.endsWith('.html')) {
                const text = fs.readFileSync(file, 'utf8')
                  .replaceAll('__MINDDECK_VERSION__', displayVersion)
                  .replaceAll('__MINDDECK_PACKAGE_VERSION__', pkg.version);
                fs.writeFileSync(file, text);
              }
            }
          }

          walk('_site');
          fs.writeFileSync('_site/version.json', JSON.stringify({
            packageVersion: pkg.version,
            displayVersion,
            commit: process.env.GITHUB_SHA || null
          }, null, 2) + '\n');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
