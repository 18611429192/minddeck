name: MindDeck CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MindDeck release checks
        run: npm run release:check
