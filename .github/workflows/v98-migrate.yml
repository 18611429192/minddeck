name: One-shot V9.8 migration

on:
  push:
    branches: [refactor/v9.8-complete]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v9.8-complete
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Repair migration-script quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/v98-upgrade.mjs')
          s=p.read_text()
          s=s.replace("assert.ok(!portable.includes('const doc=String.raw`<!DOCTYPE html>'),'portable HTML shell was copied back into JS');", "assert.ok(!portable.includes('const doc=String.raw'+String.fromCharCode(96)+'<!DOCTYPE html>'),'portable HTML shell was copied back into JS');")
          p.write_text(s)
          PY
      - name: Apply V9.8 migration
        run: node scripts/v98-upgrade.mjs
      - name: Align regression harness with V9.8 generated templates
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('src/runtime/modules').glob('*.js'):
              s=p.read_text()
              p.write_text(s.replace('global.','globalThis.'))

          for p in Path('tests').rglob('*.mjs'):
              s=p.read_text()
              s=s.replace("'9.7.0'", "'9.8.0'").replace('"9.7.0"', '"9.8.0"')
              p.write_text(s)

          p=Path('tests/e2e/minddeck.spec.mjs')
          s=p.read_text()
          old="test('folding a showcase branch changes the presentation sequence',async({page})=>{await page.goto('/?showcase=1');await expect(page.locator('#tocTree')).toContainText('权限');const security=page.locator('.toc-item').filter({hasText:'安全'}).first();await security.locator('.fold-mini').click();await expect(page.locator('#tocTree')).not.toContainText('权限')});"
          new="test('folding a showcase branch changes the presentation sequence',async({page})=>{await page.goto('/?showcase=1');await expect(page.locator('#tocTree')).toContainText('权限');const fold=page.locator('.toc-item').filter({hasText:'安全'}).first().locator('.fold-mini');if(!(await fold.isVisible()))await page.locator('#presentTocToggle').click();await fold.click();await expect(page.locator('#tocTree')).not.toContainText('权限')});"
          if old not in s: raise SystemExit('folding e2e test not found')
          p.write_text(s.replace(old,new))

          for filename in ['scripts/verify-index.mjs','scripts/verify-single-html.mjs']:
              p=Path(filename)
              s=p.read_text()
              old="const scripts = [...html.matchAll(/<script(?: [^>]*)?>([\\s\\S]*?)<\\/script>/g)].map(m => m[1]);"
              if filename.endswith('verify-single-html.mjs'):
                  old="const scripts=[...html.matchAll(/<script(?: [^>]*)?>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]);"
                  new="const scripts=[...html.matchAll(/<script([^>]*)>([\\s\\S]*?)<\\/script>/g)].filter(m=>!/type=[\\\"']text\\/plain[\\\"']/i.test(m[1])).map(m=>m[2]);"
              else:
                  new="const scripts = [...html.matchAll(/<script([^>]*)>([\\s\\S]*?)<\\/script>/g)].filter(m => !/type=[\\\"']text\\/plain[\\\"']/i.test(m[1])).map(m => m[2]);"
              if old not in s: raise SystemExit(filename+' script matcher not found')
              p.write_text(s.replace(old,new))

          p=Path('scripts/verify-modular-build.mjs')
          s=p.read_text()
          old="const appBundle=manifest.scripts.map(read).join('\\n\\n');"
          new="const pkg=JSON.parse(fs.readFileSync(new URL('../package.json',import.meta.url),'utf8')); const version=pkg.version.split('-')[0],isRc=/-rc(?:\\.|$)/.test(pkg.version),display='V'+version+(isRc?' RC':''); let appBundle=manifest.scripts.map(read).join('\\n\\n'); appBundle=appBundle.replaceAll('__MINDDECK_APP_VERSION__',display).replaceAll('__MINDDECK_RUNTIME_VERSION__',version).replaceAll('__MINDDECK_RELEASE_CHANNEL__',isRc?'rc':'stable');"
          if old not in s: raise SystemExit('verify-modular appBundle line not found')
          p.write_text(s.replace(old,new))

          audit_lines=[
              "import fs from 'node:fs';",
              "import assert from 'node:assert/strict';",
              "const read=p=>fs.readFileSync(new URL('../'+p,import.meta.url),'utf8');",
              "const runtimeIndex=read('src/runtime/index.js');",
              "const demo=read('site/demo.html');",
              "const portable=read('src/app/modules/40-portable-export.js');",
              "const moduleDir=new URL('../src/runtime/modules/',import.meta.url);",
              "const modules=fs.readdirSync(moduleDir).filter(x=>x.endsWith('.js'));",
              "assert.ok(modules.length>=20,'shared runtime was not split into ES modules');",
              "for(const file of modules){const code=fs.readFileSync(new URL(file,moduleDir),'utf8');assert.ok(code.includes('export const '),'runtime module lacks ESM export: '+file);assert.ok(!code.includes('global.'),'legacy IIFE global reference remains: '+file)}",
              "assert.ok(runtimeIndex.includes(\"from './modules/\"),'runtime index does not import modules');",
              "assert.ok(runtimeIndex.includes('globalThis.MindDeckCore=MindDeckCore'),'runtime index does not expose browser core');",
              "for(const marker of ['const slides=','function visible(','function renderToc(','function step(','toggleSecurity']) assert.ok(!demo.includes(marker),'Pages demo reintroduced a second presentation implementation: '+marker);",
              "assert.ok(demo.includes('app.html?showcase=1'),'Pages demo does not route through the real app/runtime');",
              "assert.ok(portable.includes('minddeck-portable-shell'),'portable exporter does not consume shared shell source');",
              "assert.ok(!portable.includes('const doc=String.raw'+String.fromCharCode(96)+'<!DOCTYPE html>'),'portable HTML shell was copied back into JS');",
              "const adapters=['src/core/ids.js','src/core/tree.js','src/core/layout.js','src/core/presentation.js','src/core/project.js','src/core/commands.js','src/core/recovery.js','src/core/diagnostics.js'];",
              "for(const file of adapters){const code=read(file);assert.ok(code.includes(\"from './runtime.js'\"),file+' is not a shared runtime adapter')}",
              "console.log('Architecture audit: OK (ES module runtime, unified Demo, shared Portable shell)');"
          ]
          Path('scripts/verify-architecture.mjs').write_text('\n'.join(audit_lines)+'\n')

          portable_lines=[
              "import fs from 'node:fs';",
              "import assert from 'node:assert/strict';",
              "const html=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');",
              "const contracts=[",
              "['portable shell embed','id=\"minddeck-portable-shell\"'],",
              "['portable runtime placeholder','Portable Runtime __PORTABLE_RUNTIME_VERSION__'],",
              "['shared runtime source','minddeck-shared-runtime'],",
              "['single portable mount','MindDeckCore.Portable.mount({data,kind:KIND'],",
              "['map reflow control','id=\"reflowBtn\"'],",
              "['expand all control','id=\"expandBtn\"'],",
              "['collapse all control','id=\"collapseBtn\"'],",
              "['layout selector','id=\"layoutSel\"'],",
              "['theme selector','id=\"themeSel\"'],",
              "['TOC toggle','id=\"tocToggle\"'],",
              "['fullscreen control','id=\"fullBtn\"'],",
              "['mindmap builder','function buildStandaloneMindmapHtml()'],",
              "['presentation builder','function buildStandaloneViewerHtml()'],",
              "['fusion builder','function buildStandaloneFusionHtml()'],",
              "['export data core','function buildPortableData(kind){return ExportDataCore.project(data,kind)}']",
              "];",
              "for(const [name,marker] of contracts) assert.ok(html.includes(marker),'Portable contract missing: '+name);",
              "console.log('Portable export contracts: OK ('+contracts.length+' checks)');"
          ]
          Path('scripts/verify-portable-contracts.mjs').write_text('\n'.join(portable_lines)+'\n')
          PY
      - name: Install dependencies and create lockfile
        run: npm install
      - name: Run release checks
        run: npm run release:check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run e2e
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: complete V9.8 architecture and repository cleanup"
          git push origin HEAD:refactor/v9.8-complete
