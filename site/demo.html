<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindDeck Demo · __MINDDECK_VERSION__</title>
<style>
:root{--ink:#20283a;--muted:#6d7789;--line:#dce3ec;--paper:#f4f7fb;--navy:#1f2a44;--blue:#4f6ef7;--teal:#20a89a;--orange:#f28c5b;--purple:#8b63d9;--gold:#e9b949;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#e8edf4;color:var(--ink);overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);z-index:20}.brand{font-weight:850;display:flex;align-items:center;gap:9px}.dot{width:18px;height:18px;border-radius:6px;background:var(--navy);box-shadow:inset 7px 7px 0 var(--blue)}.version{font-size:11px;color:#5264b9;background:#edf1ff;border:1px solid #dbe3ff;border-radius:999px;padding:4px 8px}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;height:36px;padding:0 12px;border-radius:10px;font-weight:750;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.main{min-height:0;display:grid;grid-template-columns:270px 1fr}.toc{background:#fff;border-right:1px solid var(--line);padding:16px 12px;overflow:auto}.toc h3{font-size:11px;letter-spacing:.8px;color:#919baa;margin:0 8px 12px}.item{display:flex;align-items:center;gap:7px;border-radius:10px;padding:8px 9px;font-size:13px;cursor:pointer;margin:2px 0}.item:hover{background:#f4f6fa}.item.active{background:#eaf0ff;color:#344fc4;font-weight:800}.item.level1{padding-left:18px}.item.level2{padding-left:36px}.toggle{width:20px;height:20px;border:0;background:#f1f4f8;border-radius:6px;cursor:pointer;color:#6d7789;font-weight:900}
.present{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:26px}.stage-wrap{width:min(100%,calc((100vh - 118px)*16/9));aspect-ratio:16/9;position:relative}.stage{position:absolute;inset:0;background:#f5f7fb;border-radius:18px;overflow:hidden;box-shadow:0 28px 70px rgba(31,42,68,.2);border:1px solid #d6dee8}.master-top{position:absolute;left:0;right:0;top:0;height:8px;background:var(--navy)}.brandline{position:absolute;left:4.5%;top:4.5%;font-size:1.05vw;font-weight:850;color:var(--navy)}.brandline i{display:inline-block;width:.75vw;height:.75vw;border-radius:50%;background:var(--blue);margin-right:.55vw}.footer{position:absolute;left:4.5%;right:4.5%;bottom:4.5%;border-top:1px solid var(--line);padding-top:1%;font-size:.68vw;color:#8791a1;display:flex;justify-content:space-between}.content{position:absolute;inset:10% 6% 10%}.eyebrow{font-size:.78vw;font-weight:850;letter-spacing:1px;margin-bottom:1vw}.title{font-size:3.1vw;line-height:1.08;letter-spacing:-1px;font-weight:850;margin:0 0 1vw}.subtitle{font-size:1.2vw;color:var(--muted);max-width:80%;margin:0}.accent{width:8%;height:.35vw;border-radius:99px;margin-top:1.2vw}.cards{position:absolute;left:0;right:0;bottom:8%;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw}.card{background:#fff;border:1px solid var(--line);border-radius:1.2vw;padding:1.4vw;min-height:9vw}.card b{font-size:1.2vw;display:block;margin-bottom:.7vw}.card p{font-size:.9vw;color:var(--muted);margin:0}
.cover{position:absolute;inset:11% 5% 13%;background:var(--navy);border-radius:2vw;color:#fff;padding:5% 6%;overflow:hidden}.cover .eyebrow{color:#91a8ff}.cover .title{font-size:4vw}.cover .subtitle{color:#c9d3e7}.orb{position:absolute;border-radius:50%;animation:float 3.5s ease-in-out infinite}.o1{width:22%;aspect-ratio:1;background:var(--blue);right:8%;top:10%}.o2{width:10%;aspect-ratio:1;background:var(--teal);right:4%;top:40%;animation-delay:.6s}.o3{width:6.5%;aspect-ratio:1;background:var(--gold);right:20%;top:55%;animation-delay:1s}.guide{position:absolute;left:292px;top:74px;background:#fff7dc;border:1px solid #f2df9e;color:#8c6814;padding:9px 11px;border-radius:11px;font-size:12px;z-index:8}.progress{position:absolute;left:22px;bottom:16px;color:#7e899a;font-size:11px}.hint{position:absolute;right:22px;bottom:14px;background:rgba(31,42,68,.9);color:#fff;border-radius:999px;padding:7px 11px;font-size:11px}.toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-8px);background:#1f2a44;color:white;border-radius:11px;padding:8px 12px;font-size:12px;opacity:0;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@keyframes float{50%{transform:translateY(-7px)}}@keyframes enter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}.animate{animation:enter .35s ease both}
body.clean .top,body.clean .toc,body.clean .guide{display:none}.app.clean{grid-template-rows:1fr}.main.clean{grid-template-columns:1fr}.clean .present{padding:0}.clean .stage-wrap{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));aspect-ratio:auto}.clean .stage{border-radius:0;border:0}.clean .hint{display:none}
@media(max-width:820px){.main{grid-template-columns:1fr}.toc{position:fixed;left:0;top:58px;bottom:0;width:270px;z-index:15;transform:translateX(-100%);transition:.2s;box-shadow:12px 0 36px rgba(31,42,68,.12)}.toc.open{transform:none}.present{padding:12px}.guide{left:14px;top:70px}.title{font-size:5.3vw}.subtitle{font-size:2.15vw}.card b{font-size:2.1vw}.card p{font-size:1.65vw}.brandline{font-size:1.65vw}.footer{font-size:1.15vw}.eyebrow{font-size:1.35vw}.cover .title{font-size:6vw}.version{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="top"><div class="brand"><span class="dot"></span>MindDeck <span class="version">__MINDDECK_VERSION__ Showcase</span></div><div class="actions"><button class="btn" id="tocBtn">目录</button><a class="btn" href="./">首页</a><a class="btn" href="app.html">编辑器</a><button class="btn primary" id="fullBtn">全屏</button></div></div>
<div class="main" id="main"><aside class="toc" id="toc"></aside><section class="present"><div class="guide" id="guide">点击目录里“安全”前面的 −，观察后续播放序列变化。</div><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="toast" id="toast"></div><div class="progress" id="progress"></div><div class="hint">滚轮 / ↑ ↓ ← → 翻页 · T 目录 · F 全屏</div></section></div>
</div>
<script>
const VERSION="__MINDDECK_VERSION__";
const slides=[
{id:'root',t:'产品方案汇报',d:0,type:'cover'},
{id:'why',t:'为什么要做',d:0,c:'#4f6ef7',sub:'很多复杂内容本身不是一条线，而是一棵树。',cards:[['固定顺序','传统页面默认沿一条线播放。'],['结构丢失','页数越多越难看见关系。'],['现场追问','临时找备用页很容易打断节奏。']]},
{id:'problem',t:'用户问题',d:0,c:'#f28c5b',sub:'主线保持简洁，细节按现场需要继续展开。',cards:[['效率','少维护多份版本。'],['安全','结论和证据分层。'],['运维','真实问题按分支深入。']]},
{id:'security',t:'安全',d:1,c:'#f28c5b',sub:'安全不是一页，而是一个可以动态展开的分支。',cards:[['权限','谁可以做什么'],['数据','什么需要保护'],['审计','发生过什么']]},
{id:'permission',t:'权限',d:2,parent:'security',c:'#4f6ef7',sub:'从身份到角色，再落到真正允许执行的能力。',cards:[['身份','确认是谁'],['角色','落到职责'],['能力','只开放需要的操作']]},
{id:'data',t:'数据',d:2,parent:'security',c:'#20a89a',sub:'保护覆盖进入、处理和输出，而不只是在存储时加密。',cards:[['进入','来源和边界'],['处理','最小暴露'],['输出','传输和留痕']]},
{id:'audit',t:'审计',d:2,parent:'security',c:'#8b63d9',sub:'问题发生时，要能回答谁、做了什么、结果如何。',cards:[['谁','操作主体'],['动作','对象与操作'],['结果','时间和异常']]},
{id:'ops',t:'运维',d:1,c:'#f28c5b',sub:'真正的使用方式，往往和设计阶段想象的不完全一样。',cards:[['上线前','按文档验证'],['现场','真实流程分叉'],['上线后','边界逐步暴露']]},
{id:'solution',t:'我们的方案',d:0,c:'#20a89a',sub:'结构、页面、演示三层分开，但由同一份数据连接。',cards:[['结构层','思维导图保留关系'],['页面层','节点是 16:9 页面'],['演示层','展开状态决定序列']]},
{id:'runtime',t:'统一 Runtime',d:0,c:'#4f6ef7',sub:'V9.6 完成业务框架统一，编辑与导出不再维护第二套业务规则。',cards:[['Shared Core','Tree / Layout / Presentation'],['Shared Render','Map / TOC / Slide'],['Architecture Audit','阻止双实现重新出现']]},
{id:'result',t:'预期结果',d:0,c:'#e9b949',sub:'不是更炫的 PPT，而是更接近真实思考和现场讨论的表达方式。',cards:[['结构不丢','始终知道在哪'],['现场灵活','问题来了再展开'],['行为一致','编辑和导出同一业务框架']]}
];
let securityOpen=true,idx=0,wheelLock=false,tocVisible=true;
const $=s=>document.querySelector(s),toc=$('#toc'),stage=$('#stage'),progress=$('#progress'),toast=$('#toast');
function visible(){return slides.filter(x=>!(x.parent==='security'&&!securityOpen))}
function renderToc(){const list=visible(),cur=list[idx]?.id;toc.innerHTML='<h3>演示目录 · '+VERSION+'</h3>'+slides.map(s=>{if(s.parent==='security'&&!securityOpen)return '';const pad=s.d===0?'':s.d===1?'level1':'level2';const tg=s.id==='security'?`<button class="toggle" data-toggle>${securityOpen?'−':'+'}</button>`:'<span style="width:20px"></span>';return `<div class="item ${pad} ${s.id===cur?'active':''}" data-id="${s.id}">${tg}<span>${s.t}</span></div>`}).join('');toc.querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-toggle]'))return;idx=Math.max(0,visible().findIndex(x=>x.id===el.dataset.id));render()});toc.querySelector('[data-toggle]')?.addEventListener('click',e=>{e.stopPropagation();toggleSecurity()})}
function shell(inner,right){return `<div class="master-top"></div><div class="brandline"><i></i>MindDeck Showcase · ${VERSION}</div>${inner}<div class="footer"><span>MindDeck · ${VERSION}</span><span>${right}</span></div>`}
function cover(){return shell(`<div class="cover animate"><div class="eyebrow">PRODUCT PLAN / SHOWCASE</div><div class="title">产品方案汇报</div><p class="subtitle">把复杂问题保留成一棵树，再把每一个节点认真讲清楚。</p><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>`,'Showcase')}
function normal(s){return shell(`<div class="content animate"><div class="eyebrow" style="color:${s.c}">${s.id==='runtime'?'ARCHITECTURE':'DETAIL'}</div><h1 class="title">${s.t}</h1><p class="subtitle">${s.sub}</p><div class="accent" style="background:${s.c}"></div><div class="cards">${s.cards.map((c,i)=>`<div class="card" style="border-top:4px solid ${s.c};animation-delay:${.06*i}s"><b>${c[0]}</b><p>${c[1]}</p></div>`).join('')}</div></div>`,s.t)}
function render(){const list=visible();idx=Math.min(idx,list.length-1);const s=list[idx];stage.innerHTML=s.type==='cover'?cover():normal(s);progress.textContent=`${idx+1} / ${list.length} · 当前序列 ${list.length} 页`;renderToc()}
function step(d){const list=visible();idx=(idx+d+list.length)%list.length;render()}
function toggleSecurity(){const current=visible()[idx]?.id;securityOpen=!securityOpen;if(!securityOpen&&['permission','data','audit'].includes(current))idx=Math.max(0,visible().findIndex(x=>x.id==='security'));showToast(securityOpen?'权限 / 数据 / 审计重新加入序列':'3 个细节页已离开后续序列');$('#guide').style.display='none';render()}
function showToast(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1500)}
async function toggleFullscreen(){if(document.fullscreenElement){await document.exitFullscreen?.();return}clean(true);try{await document.documentElement.requestFullscreen?.()}catch{showToast('浏览器未允许全屏，已进入窗口演示')}}
function clean(on){document.body.classList.toggle('clean',on);$('#app').classList.toggle('clean',on);$('#main').classList.toggle('clean',on)}
window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();step(1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();step(-1)}else if(e.key==='Home'){idx=0;render()}else if(e.key==='End'){idx=visible().length-1;render()}else if(e.key.toLowerCase()==='t'){tocVisible=!tocVisible;toc.style.display=tocVisible?'block':'none';$('#main').style.gridTemplateColumns=tocVisible?'270px 1fr':'1fr'}else if(e.key.toLowerCase()==='f'){toggleFullscreen()}else if(e.key==='Escape'&&document.body.classList.contains('clean'))clean(false)});
window.addEventListener('wheel',e=>{if(e.target.closest('.toc')||Math.abs(e.deltaY)<12)return;e.preventDefault();if(wheelLock)return;wheelLock=true;step(e.deltaY>0?1:-1);setTimeout(()=>wheelLock=false,420)},{passive:false});
$('#fullBtn').onclick=toggleFullscreen;$('#tocBtn').onclick=()=>toc.classList.toggle('open');document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)clean(false)});
render();
</script>
</body>
</html>
