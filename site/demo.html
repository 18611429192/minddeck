<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindDeck Demo · 动态演示</title><style>
:root{--ink:#20283a;--muted:#6d7789;--line:#dce3ec;--paper:#f4f7fb;--navy:#1f2a44;--blue:#4f6ef7;--teal:#20a89a;--orange:#f28c5b;--purple:#8b63d9;--gold:#e9b949;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#e8edf4;color:var(--ink);overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);z-index:20}.brand{font-weight:850;display:flex;align-items:center;gap:10px}.dot{width:18px;height:18px;border-radius:6px;background:var(--navy);box-shadow:inset 7px 7px 0 var(--blue)}.top small{color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;height:36px;padding:0 13px;border-radius:10px;font-weight:700;color:var(--ink);cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.main{min-height:0;display:grid;grid-template-columns:270px 1fr}.toc{background:#fff;border-right:1px solid var(--line);padding:18px 13px;overflow:auto}.toc h3{font-size:12px;letter-spacing:.8px;color:#919baa;margin:0 8px 12px}.item{display:flex;align-items:center;gap:7px;border-radius:10px;padding:8px 9px;font-size:13px;cursor:pointer;margin:2px 0}.item:hover{background:#f4f6fa}.item.active{background:#eaf0ff;color:#344fc4;font-weight:750}.item.level1{padding-left:18px}.item.level2{padding-left:36px}.toggle{width:20px;height:20px;border:0;background:#f1f4f8;border-radius:6px;cursor:pointer;color:#6d7789;font-weight:900}.branchHidden{display:none}.present{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:28px}.stage-wrap{width:min(100%,calc((100vh - 118px)*16/9));aspect-ratio:16/9;position:relative}.stage{position:absolute;inset:0;background:#f5f7fb;border-radius:18px;overflow:hidden;box-shadow:0 28px 70px rgba(31,42,68,.2);border:1px solid #d6dee8}.master-top{position:absolute;left:0;right:0;top:0;height:8px;background:var(--navy)}.master-brand{position:absolute;left:4.5%;top:4.5%;font-size:1.15vw;font-weight:850;color:var(--navy)}.master-brand i{display:inline-block;width:.8vw;height:.8vw;border-radius:50%;background:var(--blue);margin-right:.6vw}.master-foot{position:absolute;left:4.5%;right:4.5%;bottom:4.5%;border-top:1px solid var(--line);padding-top:1.2%;font-size:.72vw;color:#8791a1;display:flex;justify-content:space-between}.slide-content{position:absolute;inset:10% 6% 10%}.eyebrow{font-size:.78vw;font-weight:850;letter-spacing:1px;margin-bottom:1.1vw}.title{font-size:3.15vw;line-height:1.08;letter-spacing:-1.3px;font-weight:850;margin:0 0 1.05vw}.subtitle{font-size:1.25vw;color:var(--muted);max-width:80%;margin:0}.accent{width:7.5%;height:.35vw;border-radius:99px;margin-top:1.25vw}.cards{position:absolute;left:0;right:0;bottom:8%;display:grid;grid-template-columns:repeat(3,1fr);gap:1.3vw}.card{background:#fff;border:1px solid var(--line);border-radius:1.3vw;padding:1.5vw;min-height:9.5vw}.card b{font-size:1.28vw;display:block;margin-bottom:.75vw}.card p{font-size:.93vw;color:var(--muted);margin:0}.cover{position:absolute;inset:11% 5% 13%;background:var(--navy);border-radius:2vw;color:#fff;padding:5% 6%;overflow:hidden}.cover .eyebrow{color:#91a8ff}.cover .title{font-size:4vw}.cover .subtitle{color:#c9d3e7}.orb{position:absolute;border-radius:50%;animation:float 3.6s ease-in-out infinite}.orb1{width:22%;aspect-ratio:1;background:var(--blue);right:8%;top:10%}.orb2{width:10%;aspect-ratio:1;background:var(--teal);right:4%;top:40%;animation-delay:.6s}.orb3{width:6.5%;aspect-ratio:1;background:var(--gold);right:20%;top:55%;animation-delay:1s}.cover-tags{position:absolute;left:6%;right:6%;bottom:7%;display:grid;grid-template-columns:repeat(3,1fr);gap:1vw}.cover-tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:1vw;padding:1vw}.cover-tag b{display:block;font-size:1vw}.cover-tag span{font-size:.72vw;color:#cbd4e4}.bottom-hint{position:absolute;right:24px;bottom:16px;background:rgba(31,42,68,.88);color:#fff;border-radius:999px;padding:7px 12px;font-size:11px;z-index:5}.progress{position:absolute;left:24px;bottom:18px;color:#7e899a;font-size:11px}.toast{position:absolute;left:50%;top:20px;transform:translate(-50%,-10px);background:#1f2a44;color:#fff;border-radius:12px;padding:9px 13px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}@keyframes float{50%{transform:translateY(-7px)}}@keyframes inUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.animate{animation:inUp .42s ease both}.guide{position:absolute;left:292px;top:76px;background:#fff7dc;border:1px solid #f2df9e;color:#8c6814;padding:10px 12px;border-radius:12px;font-size:12px;z-index:8;box-shadow:0 8px 26px rgba(31,42,68,.08)}
body.clean .top,body.clean .toc,body.clean .guide{display:none}.app.cleanapp{grid-template-rows:1fr}.main.cleanmain{grid-template-columns:1fr}.clean .present{padding:0}.clean .stage-wrap{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));aspect-ratio:auto}.clean .stage{border-radius:0;border:0}.clean .bottom-hint{display:none}
@media(max-width:820px){.main{grid-template-columns:1fr}.toc{position:fixed;left:0;top:58px;bottom:0;width:270px;z-index:15;transform:translateX(-100%);transition:.2s;box-shadow:12px 0 36px rgba(31,42,68,.12)}.toc.open{transform:none}.present{padding:12px}.guide{left:15px;top:70px}.title{font-size:5.4vw}.subtitle{font-size:2.2vw}.card b{font-size:2.2vw}.card p{font-size:1.7vw}.master-brand{font-size:1.7vw}.master-foot{font-size:1.2vw}.eyebrow{font-size:1.4vw}.cover .title{font-size:6vw}.cover-tag b{font-size:1.7vw}.cover-tag span{font-size:1.25vw}}
</style></head><body><div class="app" id="app"><div class="top"><div class="brand"><span class="dot"></span>MindDeck <small>Showcase</small></div><div class="actions"><button class="btn" id="tocBtn">目录</button><a class="btn" href="./">返回首页</a><a class="btn" href="app.html">打开编辑器</a><button class="btn primary" id="fullBtn">全屏演示</button></div></div><div class="main" id="main"><aside class="toc" id="toc"><h3>演示目录</h3></aside><section class="present"><div class="guide" id="guide">试一下：点击目录里“安全”前面的 − ，看看后续页数怎么变化。</div><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="toast" id="toast"></div><div class="progress" id="progress"></div><div class="bottom-hint">滚轮 / ↑ ↓ ← → 翻页 · T 隐藏目录</div></section></div></div><script>
const slides=[
{id:'root',t:'产品方案汇报',d:0,type:'cover'},
{id:'why',t:'为什么要做',d:0,c:'#4f6ef7',sub:'普通 PPT 很适合一页一页讲，但很多复杂内容本身是一棵树。',cards:[['固定顺序','页面默认沿着一条线播放。'],['结构丢失','页数越多越难看见关系。'],['现场跳转','追问往往意味着临时找页。']]},
{id:'problem',t:'用户问题',d:0,c:'#f28c5b',sub:'内容复杂后，效率、安全和运维都会变成需要按现场深入的分支。',cards:[['效率','多个版本、备用页、临场找内容。'],['安全','结论、细节和证据经常混在同一层。'],['运维','真正的问题常常最后才暴露。']]},
{id:'security',t:'安全',d:1,c:'#f28c5b',sub:'安全不是一页，而是一个可以展开的分支。',cards:[['权限','谁可以做什么'],['数据','什么数据需要保护'],['审计','发生过什么']]},
{id:'permission',t:'权限',d:2,parent:'security',c:'#4f6ef7',sub:'从身份到角色，再到真正允许执行的能力。',cards:[['身份','确认是谁。'],['角色','落到明确职责。'],['能力','只开放需要的操作。']]},
{id:'data',t:'数据',d:2,parent:'security',c:'#20a89a',sub:'保护要覆盖输入、处理和输出，而不只是在存储时加密。',cards:[['进入','来源和输入边界'],['处理','最小暴露'],['输出','导出、传输和留痕']]},
{id:'audit',t:'审计',d:2,parent:'security',c:'#8b63d9',sub:'问题发生时，最后要能回答谁、做了什么、结果如何。',cards:[['谁','操作主体和身份'],['做了什么','动作与对象'],['结果','时间、结果和异常']]},
{id:'ops',t:'运维',d:1,c:'#f28c5b',sub:'真正的使用方式，往往和设计阶段想象的不完全一样。',cards:[['上线前','按文档验证'],['现场','真实流程开始分叉'],['上线后','边界条件逐步暴露']]},
{id:'solution',t:'我们的方案',d:0,c:'#20a89a',sub:'把结构、页面和演示拆成三层。',cards:[['结构层','思维导图保留关系。'],['页面层','每个节点是 16:9 页面。'],['演示层','当前展开状态决定序列。']]},
{id:'delivery',t:'实施计划',d:0,c:'#8b63d9',sub:'先用一个真实汇报验证，再沉淀母版和示例。',cards:[['阶段 1','先证明流程能用。'],['阶段 2','沉淀母版和示例。'],['阶段 3','稳定后再扩大。']]},
{id:'result',t:'预期结果',d:0,c:'#e9b949',sub:'不是更炫的 PPT，而是一种更接近思考方式的表达工具。',cards:[['结构不丢','始终知道自己在哪。'],['临场更灵活','问题来了再展开。'],['维护更简单','减少多份 PPT。']]}
];
let securityOpen=true,idx=0,wheelLock=false,tocVisible=true;
const $=s=>document.querySelector(s),toc=$('#toc'),stage=$('#stage'),progress=$('#progress'),toast=$('#toast');
function visible(){return slides.filter(x=>!(x.parent==='security'&&!securityOpen))}
function renderToc(){const list=visible(),cur=list[idx]?.id;toc.innerHTML='<h3>演示目录</h3>'+slides.map(s=>{if(s.parent==='security'&&!securityOpen)return '';const pad=s.d===0?'':s.d===1?'level1':'level2';const tg=s.id==='security'?`<button class="toggle" data-toggle>${securityOpen?'−':'+'}</button>`:'<span style="width:20px"></span>';return `<div class="item ${pad} ${s.id===cur?'active':''}" data-id="${s.id}">${tg}<span>${s.t}</span></div>`}).join('');toc.querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-toggle]'))return;const id=el.dataset.id;idx=Math.max(0,visible().findIndex(x=>x.id===id));render()});toc.querySelector('[data-toggle]')?.addEventListener('click',e=>{e.stopPropagation();toggleSecurity()})}
function cover(){return `<div class="master-top"></div><div class="master-brand"><i></i>MindDeck Showcase</div><div class="cover animate"><div class="eyebrow">PRODUCT PLAN / DEMO</div><div class="title">产品方案汇报</div><p class="subtitle">把复杂问题保留成一棵树，再把每一个节点认真讲清楚。</p><i class="orb orb1"></i><i class="orb orb2"></i><i class="orb orb3"></i><div class="cover-tags"><div class="cover-tag"><b>结构先行</b><span>先看清完整问题</span></div><div class="cover-tag"><b>页面自由</b><span>每个节点独立排版</span></div><div class="cover-tag"><b>动态演示</b><span>现场随时展开</span></div></div></div><div class="master-foot"><span>Product Plan Demo · MindDeck</span><span>Showcase</span></div>`}
function normal(s){return `<div class="master-top"></div><div class="master-brand"><i></i>MindDeck Showcase</div><div class="slide-content animate"><div class="eyebrow" style="color:${s.c}">${s.t==='用户问题'?'PROBLEM':s.t==='我们的方案'?'SOLUTION':s.t==='实施计划'?'DELIVERY':s.t==='预期结果'?'RESULT':'DETAIL'}</div><h1 class="title">${s.t}</h1><p class="subtitle">${s.sub}</p><div class="accent" style="background:${s.c}"></div><div class="cards">${s.cards.map((c,i)=>`<div class="card" style="border-top:4px solid ${s.c};animation-delay:${.07*i}s"><b>${c[0]}</b><p>${c[1]}</p></div>`).join('')}</div></div><div class="master-foot"><span>Product Plan Demo · MindDeck</span><span>${s.t}</span></div>`}
function render(){const list=visible();idx=Math.min(idx,list.length-1);const s=list[idx];stage.innerHTML=s.type==='cover'?cover():normal(s);progress.textContent=`${idx+1} / ${list.length} · 当前序列 ${list.length} 页`;renderToc()}
function step(d){const list=visible();idx=(idx+d+list.length)%list.length;render()}
function toggleSecurity(){const current=visible()[idx]?.id;securityOpen=!securityOpen;if(!securityOpen&&['permission','data','audit'].includes(current)){idx=Math.max(0,visible().findIndex(x=>x.id==='security'))}showToast(securityOpen?'已展开：权限 / 数据 / 审计重新加入序列':'已收起：3 个细节页离开后续序列');$('#guide').style.display='none';render()}
function showToast(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1700)}
window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();step(1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();step(-1)}else if(e.key.toLowerCase()==='t'){tocVisible=!tocVisible;toc.style.display=tocVisible?'block':'none';document.querySelector('.main').style.gridTemplateColumns=tocVisible?'270px 1fr':'1fr'}else if(e.key==='Escape'&&document.body.classList.contains('clean'))clean(false)});
window.addEventListener('wheel',e=>{if(e.target.closest('.toc'))return;if(Math.abs(e.deltaY)<12)return;e.preventDefault();if(wheelLock)return;wheelLock=true;step(e.deltaY>0?1:-1);setTimeout(()=>wheelLock=false,420)},{passive:false});
$('#fullBtn').onclick=()=>{clean(true);document.documentElement.requestFullscreen?.()};$('#tocBtn').onclick=()=>toc.classList.toggle('open');document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)clean(false)});function clean(on){document.body.classList.toggle('clean',on);$('#app').classList.toggle('cleanapp',on);$('#main').classList.toggle('cleanmain',on)}
// Deterministic states used to generate README GIF screenshots.
const q=new URLSearchParams(location.search);if(q.has('shot')){document.querySelector('.guide').style.display='none';const n=Number(q.get('shot'));if(n===1)idx=2;if(n===2){idx=3;securityOpen=true}if(n===3){idx=3;securityOpen=false}if(n===4){idx=Math.max(0,visible().findIndex(x=>x.id==='solution'));securityOpen=false}if(n===5){idx=3;securityOpen=true}document.querySelectorAll('.animate').forEach(x=>x.style.animation='none')}
render();</script></body></html>
